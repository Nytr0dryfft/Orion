<!-- BEGIN: Interactive Behavior Script -->
<script data-purpose="interface-interactivity">
    // Minimal dynamic micro-interaction for user input focus polish
    document.addEventListener('DOMContentLoaded', () => {
      const input = document.querySelector('input[type="text"]');
      const inputContainer = input ? input.closest('div') : null;

      if (input && inputContainer) {
        input.addEventListener('focus', () => {
          inputContainer.classList.add('border-white/30', 'bg-[#161C25]/90');
        });
        input.addEventListener('blur', () => {
          inputContainer.classList.remove('border-white/30', 'bg-[#161C25]/90');
        });
      }
    });
  </script>
